services:
  - type: web
    name: careerpulse-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careerpulse-postgres
          property: connectionString
      - key: ENABLE_TRANSFORMERS
        value: "false"

databases:
  - name: careerpulse-postgres
    plan: free
    region: oregon
    databaseName: careerpulse
    user: careerpulse_user
